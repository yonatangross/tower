name: Release Tower app

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Installer tests
        run: /bin/bash scripts/test-install.sh
      - name: Update script tests
        run: /bin/bash scripts/test-update.sh
      # The real extracted app icons under Resources/BrandMarks are the
      # products' own marks: local developer builds carry them, a release
      # build must not. With the directory absent every row falls back to the
      # monogram or grayscale template tile.
      - name: Build app bundle
        run: scripts/build-app.sh
        env:
          TOWER_BRAND_MARKS: off
      # Ad hoc on purpose: no Developer ID identity exists (0 valid codesigning identities
      # on the build machine, no signing secret referenced by this workflow, checked 2026-09-13). An ad-hoc
      # signature is per build, so a Tower-owned Keychain item written by one artifact is
      # unreadable to the next; Tower falls back to the CLI credential, names the item on
      # its row and re-creates it at the next login (README "Signing"). If an identity is
      # added later, sign with it here and the owned items survive rebuilds.
      - name: Enforce ad hoc signature
        run: codesign --force --sign - dist/Tower.app
      - name: Package app bundle
        run: ditto -c -k --sequesterRsrc --keepParent dist/Tower.app dist/Tower.app.zip
      # The zip is what ships, so it is the thing gated: a release artifact
      # that carries BrandMarks/ fails here, not at the next build.
      - name: Fail if vendor brand marks shipped
        run: |
          if [ -d dist/Tower.app/Contents/Resources/BrandMarks ]; then
            echo "ERROR: release bundle contains BrandMarks/" >&2
            exit 1
          fi
          if unzip -l dist/Tower.app.zip | grep -q 'BrandMarks/'; then
            echo "ERROR: release zip contains BrandMarks/" >&2
            exit 1
          fi
          echo "OK: release artifact ships no BrandMarks/"
      - name: Write checksum
        run: (cd dist && shasum -a 256 Tower.app.zip > Tower.app.zip.sha256)
      - name: Upload app archive
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tower-app-${{ github.sha }}
          retention-days: 7
          path: |
            dist/Tower.app.zip
            dist/Tower.app.zip.sha256
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: macos-26
    permissions:
      contents: write
    steps:
      - name: Download app archive
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tower-app-${{ github.sha }}
          path: dist
      - name: Attach archive to release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/Tower.app.zip dist/Tower.app.zip.sha256 --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/Tower.app.zip dist/Tower.app.zip.sha256 --generate-notes --verify-tag
          fi
