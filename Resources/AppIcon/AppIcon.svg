<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1d2a4a"/>
      <stop offset="1" stop-color="#0b1022"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e9edf7"/>
      <stop offset="1" stop-color="#b9c2d8"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7cf0a8" stop-opacity="0.95"/>
      <stop offset="0.45" stop-color="#30d158" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#30d158" stop-opacity="0"/>
    </radialGradient>
    <filter id="drop" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
  <rect x="100.5" y="100.5" width="823" height="823" rx="184.5" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="2"/>
  <!-- beacon glow -->
  <circle cx="512" cy="268" r="150" fill="url(#glow)"/>
  <path d="M352 268 A160 160 0 0 1 400 156" fill="none" stroke="#7cf0a8" stroke-opacity="0.55" stroke-width="14" stroke-linecap="round"/>
  <path d="M672 268 A160 160 0 0 0 624 156" fill="none" stroke="#7cf0a8" stroke-opacity="0.55" stroke-width="14" stroke-linecap="round"/>
  <!-- tower -->
  <g filter="url(#drop)">
    <circle cx="512" cy="268" r="34" fill="#7cf0a8"/>
    <rect x="490" y="300" width="44" height="40" rx="8" fill="url(#body)"/>
    <path d="M412 344 H612 L652 820 H372 Z" fill="url(#body)"/>
    <rect x="352" y="806" width="320" height="34" rx="14" fill="#cfd6e6"/>
  </g>
  <!-- window rows as room meters -->
  <g>
    <rect x="432" y="420" width="160" height="40" rx="12" fill="#1b2440"/>
    <rect x="432" y="420" width="136" height="40" rx="12" fill="#30d158"/>
    <rect x="424" y="530" width="176" height="40" rx="12" fill="#1b2440"/>
    <rect x="424" y="530" width="96" height="40" rx="12" fill="#ffb340"/>
    <rect x="416" y="640" width="192" height="40" rx="12" fill="#1b2440"/>
    <rect x="416" y="640" width="40" height="40" rx="12" fill="#ff5a5f"/>
  </g>
</svg>
