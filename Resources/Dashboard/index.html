<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src data:; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>Tower</title>
<style>
:root{
  color-scheme:dark;
  --base:#08090b;--s1:#0f1114;--s2:#15181c;--s3:#1c2026;
  --hair:#ffffff14;--hair2:#ffffff24;
  --ink:#f7f8f8;--ink2:#d0d6e0;--mute:#8a8f98;
  --accent:#7c7cff;--accent2:#a3a3ff;
  --good:#62c073;--warn:#f2a20d;--crit:#f34e52;--info:#52a8ff;--ice:#aab2c0;
  --r1:4px;--r2:8px;--r3:12px;--r4:16px;
  --sp1:4px;--sp2:8px;--sp3:12px;--sp4:16px;--sp5:24px;--sp6:32px;
  --t-fast:120ms;--t-mid:240ms;--t-slow:700ms;--ease:cubic-bezier(.23,1,.32,1);--stag:25ms;
  --e1:inset 0 1px 0 #ffffff0d,0 0 0 1px #ffffff14;
  --e2:inset 0 1px 0 #ffffff14,0 0 0 1px #ffffff14,0 2px 32px #00000040;
  --e3:inset 0 1px 0 #ffffff1a,0 0 0 1px #ffffff1f,0 24px 64px #000000a6;
  --round:-apple-system,"SF Pro Display",system-ui,sans-serif;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:radial-gradient(900px 500px at 70% -10%,#7c7cff1c,transparent 65%),var(--base);color:var(--ink);font:17px/1.65 system-ui,-apple-system,"Arial Hebrew",sans-serif}
.layout{display:grid;grid-template-columns:150px minmax(0,1064px);gap:30px;max-width:1290px;margin:0 auto;padding:30px 20px 90px;justify-content:center}
.rail{position:sticky;top:20px;align-self:start;font-size:15px}
.rail a{display:block;padding:6px 12px;color:var(--mute);text-decoration:none;border-inline-start:2px solid var(--hair)}
.rail a.on{color:var(--ink);border-inline-start-color:var(--accent);font-weight:600}
a:focus-visible,button:focus-visible,label:focus-within{outline:2px solid var(--accent2);outline-offset:2px}
.railbtn{display:none}
@media(max-width:1000px){.layout{grid-template-columns:minmax(0,1fr);gap:0}.rail{top:0;z-index:9;background:var(--base);padding:8px 0}.rail nav{display:none}.rail.open nav{display:block}.railbtn{display:block;background:var(--s2);color:var(--ink);border:1px solid var(--hair);border-radius:9px;padding:6px 14px;font:inherit}}
h1{font-size:40px;line-height:1.15;margin:0 0 10px;font-weight:700}
h2{font-size:27px;margin:0 0 6px;line-height:1.25}
h3{font-size:16px;margin:0 0 8px;color:var(--ink2);font-weight:600}
section{padding:42px 0;scroll-margin-top:20px}
section:first-of-type{padding-top:0}
p{margin:0 0 12px;color:var(--ink2);max-width:70ch}
.lead{font-size:20px;color:var(--ink)}
.notice{border-inline-start:3px solid var(--warn);padding:4px 14px;margin:14px 0}
.surf{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px;margin:18px 0 8px}
.surf button{background:var(--s1);border:0;box-shadow:var(--e1);border-radius:var(--r3);padding:0 0 6px;color:var(--ink2);font:inherit;font-size:14px;cursor:pointer;overflow:hidden;transition:box-shadow var(--t-mid) var(--ease),transform var(--t-fast) var(--ease)}
.surf button:hover{transform:translateY(-1px)}
.surf button[aria-pressed=true]{box-shadow:inset 0 0 0 1.5px var(--accent),0 0 18px #7c7cff33;color:var(--ink)}
.surf .win{display:block;height:128px;overflow:hidden;position:relative;direction:ltr;margin-bottom:5px;pointer-events:none}
.surf .win .p{position:absolute;left:0;top:0;width:440px;max-width:none;transform:scale(.37);transform-origin:top left;box-shadow:none}
.surf .win .p.dash,.surf .win .p.dialhero{width:1040px;transform:scale(.157)}
.surf .win *{animation:none!important}
.tabs{display:flex;gap:6px;flex-wrap:wrap;padding:8px 0;align-items:center}
.tabs span{color:var(--mute);font-size:15px;margin-inline-end:6px}
.tabs button,.tabs2 button{background:var(--s2);border:1px solid var(--hair);color:var(--ink2);border-radius:20px;padding:4px 14px;font:inherit;font-size:15px;cursor:pointer}
.tabs button[aria-pressed=true],.tabs2 button[aria-pressed=true]{background:var(--ink);color:#0f1114;border-color:var(--ink);font-weight:600}
#stage{display:flex;justify-content:center;min-height:300px;margin-top:10px}
.about{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-top:18px}
.about h3{font-size:14px;color:var(--mute);font-weight:500;margin:0}.about p{font-size:15px;color:var(--ink);margin:0}
.tok{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-bottom:22px}
.sw{background:var(--s1);box-shadow:var(--e1);border-radius:var(--r2);padding:8px;font-size:13px;direction:ltr;text-align:left}
.sw i{display:block;height:34px;border-radius:var(--r1);margin-bottom:6px}
.sw code{font:12px ui-monospace,Menlo,monospace;color:var(--mute)}
.gal{display:grid;grid-template-columns:120px repeat(5,minmax(0,1fr));gap:8px;align-items:center;direction:ltr;text-align:center;background:var(--s1);box-shadow:var(--e1);border-radius:var(--r3);padding:12px;margin-bottom:12px}
.gal>b{font-size:13px;color:var(--mute);font-weight:500;text-align:left}
.gal>span.h{font-size:13px;color:var(--mute)}
.gal .cellg{display:flex;justify-content:center;align-items:center;min-height:44px;font:13px var(--round);color:var(--ink)}
.solo{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.solo>div{background:var(--s1);box-shadow:var(--e1);border-radius:var(--r3);padding:12px;direction:ltr;text-align:left;font:13px var(--round);min-width:0}
.solo h4{margin:0 0 6px;font-size:12px;font-weight:500;color:var(--mute)}
.demo{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.demo>div{background:var(--s1);box-shadow:var(--e1);border-radius:var(--r3);padding:14px;min-height:180px}
.demo button,.go{background:linear-gradient(#8d8dff,#6a6af0);color:#fff;border:0;padding:7px 16px;border-radius:var(--r2);font:inherit;font-size:15px;font-weight:600;cursor:pointer;box-shadow:inset 0 1px .4px #ffffffa0,0 0 14px #7c7cff40}
.slides{position:relative;height:90px;direction:ltr;margin:10px 0;font:13px var(--round)}
.slot{position:absolute;left:0;right:0;height:38px;display:flex;align-items:center;gap:8px;padding:0 10px;background:var(--s3);border-radius:var(--r2);box-shadow:var(--e1);transition:transform var(--t-slow) var(--ease)}
.slot.a{transform:translateY(0)}.slot.b{transform:translateY(46px)}
.ltab{width:100%;border-collapse:collapse;font-size:15px}
.ltab th,.ltab td{text-align:start;padding:7px 8px;border-top:1px solid var(--hair);color:var(--ink2);vertical-align:top}
.ltab th{color:var(--mute);font-weight:500;border-top:0}
ul.need{margin:0;padding-inline-start:20px;color:var(--ink2);max-width:70ch}
.pick{display:grid;gap:8px;margin-bottom:14px;max-width:640px}
.pick label{display:flex;gap:10px;align-items:baseline;background:var(--s2);padding:9px 14px;border-radius:var(--r2);cursor:pointer}
textarea{width:100%;max-width:640px;min-height:70px;background:var(--s2);border:1px solid var(--hair);border-radius:var(--r2);color:var(--ink);font:inherit;padding:10px;margin-bottom:12px;display:block}
pre.prompt{direction:ltr;text-align:left;background:var(--s1);padding:14px;border-radius:var(--r2);white-space:pre-wrap;font:13px/1.55 ui-monospace,Menlo,monospace;color:var(--ink2);margin:0 0 12px;max-width:640px}
#copied{color:var(--good);margin-inline-start:10px;font-size:15px}
.tabs2{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}.tabs2 button{font-size:14px;padding:3px 12px}
.fbox{max-height:420px;overflow:auto;border:1px solid var(--hair);border-radius:var(--r3)}
.fbox table{border-collapse:collapse;direction:ltr;font-size:14px;width:100%}.fbox th,.fbox td{text-align:left;padding:4px 8px;border-top:1px solid var(--hair);color:var(--ink2);white-space:nowrap}.fbox th{position:sticky;top:0;background:var(--s2);color:var(--mute);font-weight:500}
details summary{cursor:pointer;color:var(--accent2)}
/* the mock: English, left to right, 440 pt like TowerType.panelWidth */
.p{direction:ltr;text-align:left;width:440px;max-width:100%;
   background:linear-gradient(180deg,#1f2738 0,#171e2d 100%);border:1px solid #39435c;border-radius:14px;
   box-shadow:0 22px 50px #0009,inset 0 1px 0 #ffffff14;
   font:13px/1.3 var(--round);color:var(--ink);padding:12px;position:relative}
.p svg{display:block;overflow:visible}
.p text{font-family:var(--round);fill:var(--ink)}
.p text.dim{fill:var(--mute)}
.p .n{font-variant-numeric:tabular-nums;white-space:nowrap}
.bar{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px}
.bar b{font-size:14px}.bar span{font-size:12px;color:var(--mute);white-space:nowrap}
.dim{color:var(--mute)}.sec{color:var(--ink2)}
.btn{display:inline-block;background:#2f7be0;color:#fff;border-radius:8px;padding:6px 13px;font-weight:700;white-space:nowrap;box-shadow:inset 0 1px 0 #ffffff33}
.t-good{color:var(--good)}.t-warn{color:var(--warn)}.t-crit{color:var(--crit)}.t-idle{color:var(--ink2)}
.foot{display:flex;justify-content:space-between;gap:10px;color:var(--ink2);font-size:12px;margin-top:9px;white-space:nowrap}
.tr{stroke:#ffffff17;fill:none}
.v{fill:none;stroke-linecap:round}
.s-good{stroke:var(--good)}.s-warn{stroke:var(--warn)}.s-crit{stroke:var(--crit)}.s-idle{stroke:var(--ice)}
.s-hgood{stroke:url(#hgood)}.s-hwarn{stroke:url(#hwarn)}.s-hcrit{stroke:url(#hcrit)}.s-hidle{stroke:url(#hidle)}
.glow{filter:drop-shadow(0 0 7px var(--gl))}
@keyframes sweep{from{stroke-dasharray:0 100}}
@keyframes swing{from{transform:rotate(-90deg)}}
@keyframes rise{from{transform:translateY(100%)}}
.v.anim{animation:sweep 900ms cubic-bezier(.2,.8,.2,1) both}
.needle{animation:swing 1100ms cubic-bezier(.2,1.3,.4,1) both}
.fill{animation:rise 800ms cubic-bezier(.2,.8,.2,1) both}
@media(prefers-reduced-motion:reduce){.v.anim,.needle,.fill{animation:none}}

/* 1 orbit */
.o1 .hero{display:grid;grid-template-columns:186px 1fr;gap:12px;align-items:center}
.o1 .say{font-size:30px;font-weight:800;line-height:1.02}
.o1 .who{font-size:13px;color:var(--ink2);margin:2px 0 7px;white-space:nowrap}
.o1 .lg{display:grid;grid-template-columns:10px 40px 1fr;gap:2px 6px;align-items:center;font-size:12px;margin-bottom:8px}
.o1 .lg i{width:9px;height:9px;border-radius:50%}
.o1 .moons{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;margin-top:8px;padding-top:8px;border-top:1px solid #ffffff14}
.o1 .moon{text-align:center;min-width:0}
.o1 .moon svg{margin:0 auto}
.o1 .moon b{display:block;font-size:12px;margin-top:2px}
.o1 .moon span{display:block;font-size:10.5px;color:var(--mute);white-space:nowrap}

/* 2 week dial */
.o2 .hero{display:grid;grid-template-columns:272px 1fr;gap:6px;align-items:center}
.o2 .list{font-size:12px}
.o2 .list h4{margin:0 0 3px;font-size:12px;font-weight:500;color:var(--mute)}
.o2 .row{display:flex;justify-content:space-between;gap:6px;padding:2.5px 0;white-space:nowrap}
.o2 .ribbon{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px}
.o2 .ribbon b{font-size:16px;white-space:nowrap}

/* 3 fleet board */
.o3 .top{display:grid;grid-template-columns:156px 1fr;gap:12px;align-items:center}
.o3 .say{font-size:17px;font-weight:800;margin-bottom:6px;white-space:nowrap}
.o3 .tiles{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
.o3 .tile{background:#ffffff0b;border-radius:9px;padding:6px 7px;box-shadow:inset 0 1px 0 #ffffff0f}
.o3 .tile b{display:block;font-size:17px;line-height:1.15;white-space:nowrap}
.o3 .tile span{font-size:11px;color:var(--mute);white-space:nowrap}
.o3 .dl{display:grid;grid-template-columns:1fr 1fr;gap:1px 8px;font-size:11.5px;margin-top:7px}
.o3 .dl div{display:flex;gap:5px;align-items:center;white-space:nowrap}
.o3 .dl i{width:8px;height:8px;border-radius:2px;flex:none}
.chart-t{font-size:12px;color:var(--ink2);margin:9px 0 2px;display:flex;justify-content:space-between;white-space:nowrap}

/* 4 heat week */
.o4 .big{display:flex;align-items:baseline;gap:9px;white-space:nowrap}
.o4 .big b{font-size:32px;font-weight:800;line-height:1.05}
.o4 .sub{font-size:12px;color:var(--ink2);margin:2px 0 7px;white-space:nowrap}
.scale{display:flex;align-items:center;gap:3px;font-size:11px;color:var(--mute);white-space:nowrap}
.scale i{width:14px;height:8px;border-radius:2px}

/* 5 cockpit */
.o5 .hero{display:grid;grid-template-columns:244px 1fr;gap:8px;align-items:end}
.o5 .read b{display:block;font-size:24px;font-weight:800;line-height:1.1;white-space:nowrap}
.o5 .read span{display:block;font-size:12px;color:var(--ink2);margin-bottom:7px;white-space:nowrap}
.o5 .tanks{display:grid;grid-template-columns:repeat(8,1fr);gap:3px 2px;margin-top:6px}
.o5 .tank{text-align:center;min-width:0}
.o5 .tank svg{margin:0 auto}
.o5 .tank text{paint-order:stroke;stroke:#0c1220;stroke-width:3px;stroke-linejoin:round}
.o5 .tank span{display:block;font-size:10.5px;color:var(--ink2);white-space:nowrap;overflow:hidden}
.o5 .spark{display:grid;grid-template-columns:1fr 150px;gap:8px;align-items:center;font-size:12px;margin-top:8px;white-space:nowrap}

.p svg.ic{display:inline-block;vertical-align:-3px;flex:none}
.d{display:inline-block;width:7px;height:7px;border-radius:50%;flex:none}
.adv{display:flex;gap:6px;align-items:center;font-size:12.5px;color:var(--ink);margin-bottom:6px;white-space:nowrap}
.tray{margin-top:8px;padding-top:7px;border-top:1px solid #ffffff14;font-size:11.5px;color:var(--ink2);display:grid;gap:4px}
.tray>div{display:flex;align-items:center;gap:5px;white-space:nowrap}
.tray .sep,.dh .sep{flex:1}
.o1 .hero{grid-template-columns:172px 1fr}.o1 .moon span.n{color:var(--ink2)}
.o3 .dl{grid-template-columns:1fr}.o3 .dl div{gap:6px}.o3 .dl .gn{width:80px}.o3 .dl .st{display:flex;gap:2px}
.mgs{display:flex;gap:8px;align-items:center;margin-top:6px}.mg{text-align:center;font-size:10.5px;color:var(--ink2)}.mg svg{margin:0 auto}
.mt{margin-left:auto;font-size:12px;text-align:right;white-space:nowrap}.mt svg{margin-left:auto}
.dash{width:1040px;max-width:none}
.dash .dh{display:flex;align-items:center;gap:12px;margin-bottom:10px;white-space:nowrap}.dash .dh .say{font-size:24px;font-weight:800}.dash .adv{margin:0}
.dg{display:grid;grid-template-columns:176px 652px 156px;gap:14px}.dg>div{min-width:0}
.dash h4{margin:10px 0 3px;font-size:12px;font-weight:600;color:var(--mute)}
.dash table{font-size:11.5px;width:652px;direction:ltr;max-width:none}
.dash th{font-size:11px;padding:2px 4px}.dash td{padding:1px 4px;border-top:1px solid #ffffff10;color:var(--ink);vertical-align:middle}
.dash tr.on td{background:#ffffff0c}
.chip{font-size:11px;color:var(--ink2);white-space:nowrap}.chip.act{background:#2f7be0;color:#fff;border-radius:5px;padding:1px 6px;font-weight:700}
.ml{display:flex;gap:6px;align-items:center;font-size:12px;padding:1.5px 0;white-space:nowrap}.ml .lab{flex:1;font-size:11px}
.tabs2{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}.tabs2 button{background:var(--lift);border:1px solid var(--rim);color:var(--ink2);border-radius:16px;padding:3px 12px;font:inherit;font-size:14px;cursor:pointer}.tabs2 button[aria-pressed=true]{background:var(--ink);color:#0c1220}
.fbox{max-height:440px;overflow:auto;border:1px solid var(--rim);border-radius:10px}.fbox table{max-width:none}.fbox th{position:sticky;top:0;background:var(--deep)}

/* round 6: provider groups in orbit, fleet, heat, cockpit */
.gh.tight{margin:4px 0 2px;padding:3px 6px}
.gh.tight .tile{width:18px;height:18px}
.gh .gl .pl{margin:0;display:flex;gap:3px;flex-wrap:wrap}
.orbits .og{min-width:0}
.orbits .og.wide{grid-column:1/-1}
.orbits{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px 10px;margin-top:6px}
.orbits .og .moons{display:flex;gap:6px;flex-wrap:wrap;margin:2px 0 0 4px}
.orbits .moon{display:flex;flex-direction:column;align-items:center;font-size:11px;min-width:48px}
.orbits .moon.on b{color:var(--ink);text-decoration:underline;text-underline-offset:3px}
.orbits .more{align-self:center;font-size:11px;color:var(--ink2)}
.o3 .fgs{display:flex;flex-direction:column;gap:3px;margin-top:6px}
.o3 .top>div{min-width:0}
.gh.tight .gl{flex-wrap:wrap;white-space:normal}
.o3 .fg{display:grid;grid-template-columns:22px 100px minmax(0,1fr);align-items:center;gap:6px;padding:2px 6px;border-radius:6px;box-shadow:inset 2px 0 0 var(--tint);background:linear-gradient(90deg,color-mix(in srgb,var(--tint) 12%,transparent),transparent 70%)}
.o3 .fg .pl{display:flex;gap:3px;flex-wrap:wrap}
.o5 .banks{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.o5 .bank{flex:1 1 0;min-width:0}
.o5 .bank.wide{flex-basis:100%}
.o5 .bank{border-radius:8px;padding:4px 6px;box-shadow:inset 2px 0 0 var(--tint);background:linear-gradient(90deg,color-mix(in srgb,var(--tint) 10%,transparent),transparent 70%)}
.o5 .bank .bl{display:flex;align-items:center;gap:6px;font-size:12px;margin-bottom:3px}
.o5 .bank .tanks{display:flex;gap:6px;flex-wrap:wrap}

/* design system overrides on the shared mock styles */
.p{background:linear-gradient(137deg,#16191e 5%,#0e1013 76%);border:0;box-shadow:var(--e3);border-radius:var(--r4);font:13px/1.32 var(--round)}
.p text{font-family:var(--round)}
.p .say,.p b{letter-spacing:-.01em}
.btn{background:linear-gradient(#8d8dff,#6a6af0);box-shadow:inset 0 1px .4px #ffffffa0,inset 0 -1px .4px #00000033,0 0 14px #7c7cff40;border-radius:var(--r2);transition:transform var(--t-fast) var(--ease)}
.btn:hover{transform:translateY(-1px)}
.tr{stroke:#ffffff12}
.halo{filter:url(#soft);opacity:.34}
.breathe{animation:breathe 4s ease-in-out infinite}
@keyframes breathe{50%{opacity:.12}}
@keyframes sweep{from{stroke-dasharray:0 100}}
@keyframes arcin{from{stroke-dasharray:0 100}to{stroke-dasharray:100 0}}
@keyframes swingh{from{transform:rotate(-140deg)}}
@keyframes up{from{opacity:0;transform:translateY(6px)}}
@keyframes fadein{from{opacity:0}}
.v.anim{animation:sweep var(--t-slow) var(--ease) both}
.v.arcin{animation:arcin var(--t-slow) var(--ease) both}
.knob{animation:fadein var(--t-mid) var(--ease) .5s both;filter:drop-shadow(0 0 2px #0008)}
.hand{animation:swingh 1000ms var(--ease) both}
.needle{animation:swing 1100ms var(--ease) both}
.fill{animation:rise var(--t-slow) var(--ease) both}
.drow,.dash tr{animation:up var(--t-mid) var(--ease) both}
.cell{background:linear-gradient(137deg,#ffffff08,#ffffff03);box-shadow:var(--e1);border-radius:var(--r3);padding:var(--sp3);min-width:0;position:relative;overflow:hidden}
.bento{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:var(--sp3)}
.c-a{grid-column:1/5}.c-b{grid-column:5/9;display:flex;justify-content:center;align-items:center}.c-c{grid-column:9/13}.c-d{grid-column:9/13}.c-e{grid-column:1/10}.c-f{grid-column:10/13}.c-g{grid-column:1/13}
.c-a,.c-b{grid-row:1/3}
.c-a .av{display:grid;grid-template-columns:176px 1fr;gap:var(--sp2);align-items:center;height:100%}
.c-a .say{font-size:21px;font-weight:700;display:block;white-space:nowrap}
.dash h4{margin:0 0 4px;font-size:12px;font-weight:500;color:var(--mute)}.dash .cell h4:not(:first-child){margin-top:10px}
.dash .who{white-space:nowrap;margin:2px 0;color:var(--ink2)}
.mchip{display:inline-block;font-size:11px;padding:1px 6px;border-radius:5px;background:radial-gradient(75% 75% at 50% 92%,#1b1e24,#121418);box-shadow:inset 0 1px 1px #ffffff26,0 0 0 1px #000;color:var(--ink2);white-space:nowrap}

<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs id="defs">
<filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="4"/></filter>

<linearGradient id="gwarn" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffd06b"/><stop offset="1" stop-color="#f2a20d"/></linearGradient>
<linearGradient id="gcrit" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff8f92"/><stop offset="1" stop-color="#f34e52"/></linearGradient>
</defs></svg>
<div class="tip" id="tip"></div>
<div class="app">
<div class="sw2" id="switch"></div>
<div id="stage"><div class="empty">Waiting for Tower's first read.</div></div>
</div>
<script>
(function(){
'use strict';
let SNAP=null;
let NOW=0;
/* The wall clock. Every age on the page is measured against it, never against the feed's own generatedAt: a feed
   built a day ago must not look fresh. A test (or a capture) injects its own clock as window.towerClock. */
const wall=()=>typeof window.towerClock==='function'?window.towerClock():Date.now();
/* The freshness line: the TTL the feed carries (rules.freshnessTTLSeconds), Tower's 15 minutes until one arrives. */
let TTL=900;
const FEED_TTL=()=>TTL*1000;
const H=36e5,DAY=24*H,WEEK=7*DAY;
const tz={timeZone:'Asia/Jerusalem'};
const fDay=d=>new Date(d).toLocaleDateString('en-GB',{...tz,weekday:'short'});
const fClock=d=>fDay(d)+' '+new Date(d).toLocaleTimeString('en-GB',{...tz,hour:'2-digit',minute:'2-digit'});
function span(ms){const m=Math.max(1,Math.round(Math.abs(ms)/6e4));if(m<60)return m+'m';const h=Math.floor(m/60);if(h<48)return h+'h '+(m%60)+'m';return Math.floor(h/24)+'d '+(h%24)+'h'}
const short=ms=>{const h=ms/H;if(h<1)return Math.max(1,Math.round(ms/6e4))+'m';return h<48?Math.round(h)+'h':Math.round(h/24)+'d'};
const mark={claude:'cc',codex:'cx',cursor:'cu',muse:'mu',devin:'dv',agy:'ag'};
const PRIMARY={claude:'7d',codex:'7d',muse:'Weekly',devin:'Weekly',cursor:'Cursor Models',agy:'Argon weekly'};
const tones={good:'#62c073',warn:'#f2a20d',crit:'#f34e52',idle:'#aab2c0'};
document.getElementById('defs').insertAdjacentHTML('beforeend',Object.keys(tones).map(k=>`<pattern id="h${k}" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="${tones[k]}" opacity=".28"/><rect width="3" height="6" fill="${tones[k]}"/></pattern>`).join(''));

let ICONS={};
/* Tower's cap (AccountSnapshot.cappedPct), carried in the feed; 95 only until the first feed arrives. */
let CAPPED=95;

function seat(s,now){
  const w=s.windows.filter(x=>x.name!=='Fable'&&x.pct!=null&&!(x.resetsAt&&new Date(x.resetsAt).getTime()<=now)).sort((a,b)=>b.pct-a.pct)[0]||s.windows.find(x=>x.name===PRIMARY[s.provider])||s.windows[0]||{name:'?',pct:null,resetsAt:null,trust:'unknown'};
  const at=w.resetsAt?new Date(w.resetsAt).getTime():null;
  const passed=at!==null&&at<=now;
  const used=passed?0:w.pct;
  /* A window the reply did not carry ("notReported", the 5h window of a Claude capture that has a week) is not an old read: it does not lower a live seat. */
  const live=s.windows.length>0&&s.windows.filter(x=>x.name!=='Fable'&&x.trust!=='notReported').every(x=>x.trust==='live');
  /* exact: every reading the seat has is live, so its number is not an upper bound. A window with no reading has nothing to age; it still keeps the seat out of ready (live). */
  const read=s.windows.filter(x=>x.name!=='Fable'&&x.pct!=null),exact=read.length>0&&read.every(x=>x.trust==='live');
  const room=used==null?null:Math.round(100-used);
  let bucket;
  /* A seat's sign-in error comes before its old full reading: the fix is the sign-in, and the reading is not current. */
  if(s.active)bucket='inuse';
  else if(s.error==='connect-cursor')bucket='connect';
  else if(s.error==='keychain-locked')bucket='retrust';
  else if(s.error==='needs-login')bucket='login';
  else if(used>=CAPPED)bucket='full';
  else if(!s.windows.length)bucket='nodata';
  else if(live)bucket='ready';else bucket='cached';
  const L={'5h':5*H,'7d':WEEK,'Weekly':WEEK}[w.name],elapsed=L&&at&&!passed?(L-(at-now))/DAY:null;
  const burn=elapsed>0&&used>0?used/(elapsed/(L/DAY)*100):null;
  const runout=burn?(100-used)/(used/elapsed)*DAY:null;
  const tone=room==null?'idle':room<=5?'crit':room<=20?'warn':exact?'good':'idle';
  return{...s,w,at:passed?null:at,passed,used,room,live,exact,bucket,burn,runout,tone,
    read:readAge(s.capturedAt,wall()),val:room==null?(bucket==='nodata'?'not yet seen':'?'):(exact?'':'≤')+room+' %',num:room==null?'?':(exact?'':'≤')+room,
    cls:'s-'+(exact?'':'h')+tone};
}
function transform(state){
  const d=JSON.parse(JSON.stringify(SNAP));
  const set=(s,err,trust,cap)=>{s.error=err;s.errorText=err;s.capturedAt=cap;s.windows.forEach(w=>{w.trust=trust;if(w.pct===null&&trust==='live')w.pct=0})};
  if(state==='noready')d.seats.forEach((s,i)=>{set(s,null,'live',new Date(NOW-6e4).toISOString());
    const w=s.windows.find(x=>x.name===PRIMARY[s.provider])||s.windows[0];w.pct=97;
    if(new Date(w.resetsAt||0).getTime()<=NOW)w.resetsAt=new Date(NOW+(3+i%3)*DAY).toISOString()});
  if(state==='allstale')d.seats.forEach(s=>{const c=Math.min(new Date(s.capturedAt).getTime(),NOW-3*H-72e4);set(s,null,'stale',new Date(c).toISOString())});
  if(state==='keychain')d.seats.filter(s=>s.provider==='claude').forEach(s=>set(s,'keychain-locked','stale',s.capturedAt));
  return d;
}
function model(state){
  const d=transform(state),seats=d.seats.map(s=>seat(s,NOW)),by=b=>seats.filter(s=>s.bucket===b);
  /* No verified Claude login: the independent sections still draw. The active seat is an unknown placeholder, not a throw. */
  const active=seats.find(s=>s.active)||seat({nick:'?',provider:'claude',plan:'?',tier:null,active:false,capturedAt:new Date(NOW).toISOString(),error:null,errorText:null,model:null,windows:[]},NOW),claude=seats.filter(s=>s.provider==='claude');
  const cand=claude.filter(s=>!s.active&&s.bucket!=='full'&&s.room!=null).sort((a,b)=>(b.live-a.live)||(b.room-a.room));
  const firstFull=by('full').filter(s=>s.at).sort((a,b)=>a.at-b.at)[0];
  const next=firstFull||claude.filter(s=>s.at).sort((a,b)=>a.at-b.at)[0]||null;
  const others=seats.filter(s=>s.provider!=='claude'&&s.bucket==='ready');
  const locked=claude.filter(s=>s.error==='keychain-locked').length,out=claude.filter(s=>s.error==='needs-login').length;
  let v;
  const wk=active.val+' of week';
  /* The live verdict comes from tower_advice (Tower's own decision), never from the active seat alone:
     stay, switch, wait or can't tell. A used-up active seat never reads YES. */
  const real=state==='real'&&d.advice&&d.advice.kind?d.advice:null,k=real&&real.kind,exhausted=active.room!=null&&active.room<=0;
  /* Nothing has ever been read (an empty store on a first open, or seats with no window at all): no verdict about room. */
  const noReadings=state==='real'&&!seats.some(s=>s.windows.some(w=>w.pct!=null));
  if(noReadings)v=locked
    ?{tone:'warn',word:'NO READINGS',kind:'empty',line:'Tower has not read any seat yet, '+locked+' '+(locked===1?'seat is':'seats are')+' locked',btn:'Re-trust '+locked+' '+(locked===1?'seat':'seats'),hint:'Refresh cannot unlock them. One approval can'}
    :{tone:'warn',word:'NO READINGS',kind:'empty',line:'Tower has not read any seat yet',btn:'Refresh now',hint:'Reads every seat it can reach'};
  else if(real&&(k==='allResting'||(exhausted&&k!=='switch')))v={tone:'crit',word:'WAIT',kind:'wait',line:k==='allResting'?(locked?locked+' seats are locked, not empty':'Nothing has room')+(next&&next.at?'. First back '+next.nick+' '+fClock(next.at):real.earliestReset?'. First back '+fClock(new Date(real.earliestReset).getTime()):''):active.w.name+' is used up'+(active.at?', back '+fClock(active.at):''),btn:locked?'Re-trust '+locked+' seats':null,hint:locked?'One approval brings them back':'Nothing to press'};
  else if(real&&k==='switch')v={tone:active.room!=null&&active.room<=5?'crit':'warn',word:'SWITCH',kind:'switch',target:real.nickname,line:real.nickname+' has more room than '+active.nick,btn:'/login to '+real.nickname,hint:'Then refresh'};
  else if(state==='real'&&(k==='activeUnknown'||!active.windows.length))v={tone:'warn',word:"CAN'T TELL",kind:'unknown',line:'Tower cannot verify the active seat',btn:'Refresh now',hint:'Reads every seat it can reach'};
  else if(real&&!active.live)v={tone:'warn',word:'PROBABLY',kind:'stale',line:'Tower stopped reading '+span(active.read)+' ago',btn:'Refresh now',hint:'Reads every seat it can reach'};
  else if(state==='noready')v={tone:'crit',word:'WAIT',line:'Nothing has room. First back '+next.nick+' '+fClock(next.at),btn:null,hint:'Nothing to press'};
  else if(state==='allstale')v={tone:'warn',word:'PROBABLY',line:'Tower stopped reading '+span(active.read)+' ago',btn:'Refresh now',hint:'Reads every seat it can reach'};
  else if(state==='keychain')v={tone:'crit',word:"CAN'T TELL",line:'Keychain refused Tower, read '+span(active.read)+' ago',btn:'Re-trust '+locked+' seats',hint:'Then Always Allow'};
  else{const t=active.room==null?'warn':active.room<=5?'crit':active.room<=20?'warn':'good';v={tone:active.live?t:'warn',word:'YES',line:active.val+' left in '+active.w.name+', read '+span(active.read)+' ago',btn:locked?'Re-trust '+locked+' seats':null,hint:locked?'Frees '+cand.filter(s=>s.bucket==='retrust').map(s=>s.nick).join(', '):'Nothing to press'};}
  /* The headline is a verdict about ONE seat. It may name that seat only when three things hold (approved mockup): the feed is younger than the freshness line, the seat's own readings are not past it, and it is the
     seat the menu bar title names. Otherwise: CAN'T TELL, the age, a Refresh, and no seat and no percent. */
  const feedAge=wall()-NOW,old=state==='real'&&feedAge>FEED_TTL();
  const named=seats.some(s=>s.active)?active:null;
  const blindV=(why,line,hint)=>({tone:'idle',word:"CAN'T TELL",kind:'blind',blind:why,line,btn:'Refresh now',hint});
  if(old)v=blindV('oldfeed','last read '+span(feedAge)+' ago','This picture is older than '+span(FEED_TTL()));
  else if(state==='real'&&!noReadings&&named&&headStale(named))
    v=blindV('stale',named.read==null?'not read yet':'last read '+span(named.read)+' ago','The active seat has no reading from the last '+span(FEED_TTL()));
  else if(state==='real'&&!noReadings&&named&&!sameSeat(named,d.menubarTitle)){
    if(typeof console!=='undefined'&&console.warn)console.warn('Tower: the headline seat '+named.nick+' differs from the menu bar title '+d.menubarTitle);
    v=blindV('title','Tower and the menu bar name different logins','Refresh reads the login again');}
  const cap=claude.filter(s=>s.used!=null);
  const capAt=t=>!cap.length?0:cap.reduce((a,s)=>a+((s.at&&s.at<=t)?100:(s.room||0)),0)/(cap.length*100)*100;
  return{state,d,seats,by,active,cand,next,others,v,locked,out,capAt,old};
}
/* The seat a menu bar title names: its one leading glyph and its trailing percent come off ("🟢alpha 79%" is alpha).
   A feed that carries no title says nothing to compare, so it cannot disagree. */
const titleSeat=t=>typeof t==='string'&&t.trim()?t.replace(/^[^A-Za-z0-9]+/,'').replace(/\s*\d+\s*%\s*$/,'').trim():null;
const sameSeat=(s,title)=>{const n=titleSeat(title);return n===null||n===s.nick};
/* A seat whose reading is past the freshness line. A window with no reading at all is unmeasured, not stale. */
const headStale=s=>s.windows.some(w=>w.name!=='Fable'&&w.pct!=null&&w.trust==='stale');

/* drawing helpers */
let uid=0;
function polar(cx,cy,r,deg){const a=(deg-90)*Math.PI/180;return[cx+r*Math.cos(a),cy+r*Math.sin(a)]}
function arc(cx,cy,r,from,to){const[a,b]=polar(cx,cy,r,from),[c,d]=polar(cx,cy,r,to);return`M${a.toFixed(2)} ${b.toFixed(2)}A${r} ${r} 0 ${to-from>180?1:0} 1 ${c.toFixed(2)} ${d.toFixed(2)}`}
/* What the last operator action left (a Re-trust that failed or left seats unreadable); text only, escaped by adapt(). */
const noticeOf=m=>m.d.notice?`<div class="notice" style="color:#f2a20d;font-size:13px;padding:4px 2px">${m.d.notice}</div>`:'';
const barTop=m=>`<div class="bar"><b>Tower</b><span>read ${span(wall()-NOW)} ago</span></div>${noticeOf(m)}`;
const money=m=>usd(m.d.money.openrouter.balanceUSD);
const tipOf=s=>[s.nick+' ('+s.provider+')',s.val+' left',s.at?'resets '+fClock(s.at):s.passed?'window already reset':'no reset known',(s.read==null?'never read':'read '+span(s.read)+' ago'),'model '+(s.model||'?'),s.windows.map(w=>w.name+' '+(w.pct==null?'?':Math.round(w.pct)+' %')).join(', '),s.errorText||s.note||'',
  s.windows.some(w=>w.pct!=null&&w.trust==='stale')&&!DIAL_ACT[s.bucket]?'stale since '+staleAt(s)+'\nrefresh: '+(STALE_STEP[s.provider]||'open the app that reports it'):''].filter(Boolean).join('\n');
const hint=s=>({retrust:'Re-trust',login:'/login',ready:'ready',cached:'cached',nodata:'no reading',connect:'Connect'}[s.bucket]||'');
const paceTxt=a=>a.runout?'~'+short(a.runout):'?';


const SYM={claude:'claude',codex:'chatgpt',cursor:'cursor',devin:'devin',agy:'antigravity',muse:'muse',pi:'pi',openrouter:'openrouter',gemini:'gemini'};
const ic=(p,z=14)=>`<svg class="ic" width="${z}" height="${z}" aria-label="${p}"><use href="#i-${SYM[p]}" width="${z}" height="${z}"/></svg>`;
const icAt=(p,x,y,z)=>`<use href="#i-${SYM[p]}" x="${x}" y="${y}" width="${z}" height="${z}"/>`;
const modelOf=s=>s.model?s.model.replace('xiaomi/','').replace(/^auto$/,'Cursor Auto'):'?';
const planOf=s=>s.provider==='claude'?(s.tier||'').replace('default_claude_','').replace('_',' ')||s.plan:(s.plan||'').replace('Muse Code Power Usage','Power').replace('unified_','');
const burnTxt=s=>s.burn==null?'-':s.burn.toFixed(1)+'×';
const outTxt=s=>s.bucket==='full'?'capped':s.runout==null?'-':s.runout>(s.at-NOW)?'lasts':'~'+short(s.runout);
/* The run-out as a whole phrase, one template for every headline. outTxt is a cell value ("lasts", "~5h"); put after
   "runs out" it read "runs out lasts" (18.11.2026). */
const runsOutTxt=s=>s.bucket==='full'?'is capped':s.runout==null?'run-out unknown':s.runout>(s.at-NOW)?'lasts past its reset':'runs out in ~'+short(s.runout);
/* A seat at or over Tower's cap, or with no room left, as words that carry the number. The bare word "full" was read as
   100 % (18.11.2026: yg at 96 %). */
const cappedTxt=s=>(s.room==null?'?':Math.max(0,s.room))+' % left, capped';
/* The resting line (Core.restingStaleTTL, 24 h): a reading older than it is no number at all, only the time it was read. */
const RESTING=DAY;
const fDate=d=>new Date(d).toLocaleDateString('en-GB',{...tz,day:'2-digit',month:'2-digit'}).replace('/','.');
/* "Sat 11:44" inside a day, "Fri 23.10 19:38" past it, so an old reading carries its date. */

    money:{openrouter:{balanceUSD:last?+last.available.toFixed(2):null,addedUSD:last?last.totalCredits:0,leftPct:last&&last.totalCredits?+(last.available/last.totalCredits*100).toFixed(1):0,
      rate7d:rate(7),rate30d:rate(29.9),history:S.map(x=>({t:x.capturedAt,usd:x.available}))},pi:pi&&typeof pi.monthUSD==='number'?{...pi}:{monthUSD:0,absent:true},typesafe:'no balance entered'},
    sessions:{available:sess.available!==false,line:br.line||'',level:br.level,unknown:iv.filter(x=>!x.accountEmail).length,confirmed:iv.filter(x=>x.accountEmail).length,background:sess.backgroundCount||0,
      list:iv.map(x=>({label:x.label||x.name||'?',busy:!!x.busy,status:x.status,repo:x.repo,model:x.model||null,seat:seatOf(x),evidence:x.accountEvidence||null}))},
    lanes:lanesList.map(l=>({provider:l.provider,label:l.label,model:l.configModel,detail:l.headerDetail||'',state:l.state,lastLimitHit:l.lastLimitHit,lastDispatch:l.lastDispatch})),
    alerts:{crossing:alerts.filter(x=>x.crossing).map(x=>x.nickname+' '+x.crossing),pending:alerts.flatMap(x=>a(x.pending)).length,
      announced:alerts.flatMap(x=>a(x.announced).map(y=>x.nickname+' '+y.window+' '+y.level)),rail:o(raw.alerts).rail},
    rules:{ttlSeconds:fr.freshnessTTLSeconds,pollSeconds:fr.pollIntervalSeconds}};
}

const SURF=[['dial','Week dial',dialHero],['dash','Dashboard',o6]];
let surf='dial',last=null;
const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
function counts(root){if(reduced)return;root.querySelectorAll('[data-count]').forEach(e=>{const end=+e.dataset.count,pre=e.dataset.pre||'',suf=e.dataset.suf||'',dp=(String(end).split('.')[1]||'').length;
  const t0=performance.now();(function tick(t){const k=Math.min(1,(t-t0)/700),v=end*(1-Math.pow(1-k,4));e.textContent=pre+(k<1?v.toFixed(dp):end.toFixed(dp))+suf;if(k<1)requestAnimationFrame(tick)})(t0)})}
function draw(animate){if(!SNAP)return;
  document.getElementById('switch').innerHTML=SURF.map(x=>'<button type="button" data-v="'+x[0]+'" aria-pressed="'+(x[0]===surf)+'">'+x[1]+'</button>').join('');
  const stage=document.getElementById('stage');
  try{stage.innerHTML=SURF.find(x=>x[0]===surf)[2](model('real'));if(animate)counts(stage)}
  catch(e){stage.innerHTML='<div class="empty">Tower could not draw this read: '+String(e&&e.message||e).replace(/[<&]/g,'')+'</div>'}}
document.getElementById('switch').addEventListener('click',e=>{const b=e.target.closest('button');if(b){surf=b.dataset.v;draw(true)}});
window.towerUpdate=function(feed){const first=!SNAP;last=feed;installIcons(feed.icons||{});
  try{SNAP=adapt(feed);NOW=new Date(SNAP.generatedAt).getTime();CAPPED=typeof feed.cappedPct==='number'?feed.cappedPct:95;
    TTL=Number.isFinite(SNAP.rules.ttlSeconds)&&SNAP.rules.ttlSeconds>0?SNAP.rules.ttlSeconds:900}
  catch(e){SNAP=null;document.getElementById('switch').innerHTML='';document.getElementById('stage').innerHTML='<div class="empty">'+String(e&&e.message||e).replace(/[<&]/g,'')+'</div>';return}
  draw(first)};
window.towerSurface=function(v){if(SURF.some(x=>x[0]===v)){surf=v;draw(true)}};
/* A page left open ages by itself: once a second the feed's age is checked against the freshness line, and the page is
   drawn again when it crosses (and once a minute after, so "last read 22h 4m ago" keeps counting). */
let agedKey=null;
function ageTick(){if(!SNAP)return;const age=wall()-NOW,old=age>FEED_TTL(),key=old?'old:'+Math.floor(age/6e4):'fresh';
  if(agedKey!==null&&key!==agedKey)draw(false);agedKey=key}
if(typeof setInterval==='function')setInterval(ageTick,1000);
const tip=document.getElementById('tip');
document.addEventListener('mousemove',e=>{const r=e.target.closest&&e.target.closest('[data-tip]');if(!r){tip.style.display='none';return}
  tip.textContent=r.getAttribute('data-tip').replace(/\\n/g,'\n');tip.style.display='block';tip.style.left=Math.min(innerWidth-290,e.clientX+14)+'px';tip.style.top=(e.clientY+14)+'px'});
})();
</script>
